<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff4fa"><title>Lucy — Hinglish AI Companion</title>
<style>
:root{--pink:#ed5c9d;--ink:#372936;--muted:#a98598;--line:#f5dce9;--soft:#fff1f7}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(circle at 20% 0%,#ffe3f0 0 18%,transparent 42%),linear-gradient(145deg,#fff9fc,#f5edff)}body{min-height:100dvh;display:grid;place-items:center}.app{width:min(760px,100%);height:min(900px,100dvh);background:#fff;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 80px #b64b8026}@media(min-width:650px){.app{height:92dvh;border:1px solid var(--line);border-radius:30px}}header{position:relative;z-index:2;display:flex;align-items:center;gap:14px;padding:calc(18px + env(safe-area-inset-top)) 20px 16px;border-bottom:1px solid #faedf3;background:#fffafd;box-shadow:0 4px 20px #bd659014}h1{font-size:20px;line-height:1;margin:0;letter-spacing:-.7px}header p{font-size:11px;color:var(--muted);margin:6px 0 0}header span{color:#2fb57a}.status{margin-left:auto;border:1px solid #f0d7e4;border-radius:99px;padding:7px 9px;color:#b7869f;background:#fff3f8;font-size:9px;white-space:nowrap}.avatar{width:58px;height:58px;flex:none;position:relative;display:grid;place-items:center;border-radius:21px;background:linear-gradient(145deg,#ffd1e4 0 12%,#ff91bc 45%,#d83f82 100%);color:#fff;font-weight:900;font-size:24px;transform-style:preserve-3d;box-shadow:inset -10px -12px 16px #99235b70,inset 8px 7px 12px #fff9,0 14px 28px #e04f933d;animation:float3d 3.6s ease-in-out infinite}.avatar:before{content:"";position:absolute;inset:8px 23px 35px 10px;border-radius:50%;background:#fff9;filter:blur(2px);transform:translateZ(18px) rotate(-24deg)}.avatar:after{content:"♡";position:absolute;right:-9px;top:-13px;color:#ee609d;font-size:20px;transform:translateZ(28px);animation:heartbeat 1.8s ease-in-out infinite}@keyframes float3d{0%,100%{transform:rotateX(4deg) rotateY(-9deg) translateY(0)}50%{transform:rotateX(-5deg) rotateY(10deg) translateY(-7px)}}@keyframes heartbeat{50%{transform:translateZ(28px) scale(1.3);opacity:.65}}.messages{flex:1;overflow:auto;padding:22px 18px 18px;scroll-behavior:smooth}.bubble{position:relative;width:fit-content;max-width:88%;margin:10px 0;padding:13px 15px;border-radius:19px 19px 19px 6px;background:var(--soft);color:#604657;font-size:14px;line-height:1.55;box-shadow:0 5px 14px #df8db21a}.bubble.you{margin-left:auto;border-radius:19px 19px 6px 19px;background:linear-gradient(135deg,#f174ae,#dd4b89);color:white}.bubble b{font-size:9px;letter-spacing:1px;color:#db5790}.bubble p{margin:3px 0}.speak{display:block;margin:8px 0 0 auto;border:0;border-radius:9px;padding:5px 8px;background:#ffd9e8;color:#d6508b;cursor:pointer}.bottom{padding:10px 16px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #f8e8ef;background:#fff}.chips{display:flex;gap:7px;overflow:auto;padding:0 2px 9px;scrollbar-width:none}.chip{border:1px solid #f0d6e3;background:#fff8fb;color:#9d7187;border-radius:99px;padding:7px 10px;white-space:nowrap;font-size:11px}.controls{display:flex;gap:6px;overflow:auto;scrollbar-width:none;margin-bottom:8px}.controls label{display:flex;align-items:center;gap:4px;border:1px solid #f0dce5;border-radius:99px;padding:7px 9px;color:#987589;font-size:10px;white-space:nowrap}.controls select{border:0;background:transparent;color:#825b72;outline:0;font-size:10px}.composer{display:flex;gap:8px;border:1px solid #eed6e3;border-radius:18px;padding:5px;background:#fff;box-shadow:0 5px 18px #d65f9816}.composer input{min-width:0;flex:1;border:0;outline:0;padding:10px;font-size:14px}.send{width:44px;height:40px;border:0;border-radius:14px;background:var(--pink);color:#fff;font-size:17px;font-weight:800}.note{text-align:center;display:block;padding-top:7px;color:#c4a5b5;font-size:9px}
</style></head>
<body><main class="app"><header><div class="avatar">L</div><div><h1>Lucy</h1><p>Hinglish companion · <span>online</span></p></div><div class="status">3D mood on</div></header><section id="messages" class="messages"><div class="bubble"><b>LUCY</b><p>Heyy, main Lucy hoon. Aaj tumhara mood kaisa hai?</p><button class="speak" aria-label="Voice">🔊</button></div></section><div class="bottom"><div class="chips"><button class="chip" data-text="Mujhe cheer up karo">Cheer me up</button><button class="chip" data-text="Aaj ka mood soft rakho">Soft mood</button><button class="chip" data-text="Mere saath thoda playful baat karo">Playful</button></div><div class="controls"><label>Mood <select id="mood"><option value="soft">Soft</option><option value="playful">Playful</option><option value="caring">Caring</option></select></label><label><input id="flirt" type="checkbox"> Light flirt</label><label><input id="age" type="checkbox"> 18+</label></div><form class="composer" id="form"><input id="input" placeholder="Lucy ko message karo..." autocomplete="off"><button class="send" aria-label="Send">↑</button></form><small class="note">Mobile-first · consent-aware · API keys backend par rakho</small></div></main>
<script>
const API_BASE=new URLSearchParams(location.search).get('api')||localStorage.getItem('lucy_api_base')||'';const $=id=>document.getElementById(id),box=$('messages'),form=$('form'),input=$('input'),mood=$('mood'),flirt=$('flirt'),age=$('age');let history=[];function esc(v){return v.replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]))}function add(role,text){const e=document.createElement('div');e.className='bubble'+(role==='user'?' you':'');e.innerHTML=role==='assistant'?`<b>LUCY</b><p>${esc(text)}</p><button class="speak">🔊</button>`:`<p>${esc(text)}</p>`;if(role==='assistant')e.querySelector('.speak').onclick=()=>speak(text);box.appendChild(e);box.scrollTop=box.scrollHeight}async function speak(text){try{if(API_BASE){const r=await fetch(API_BASE+'/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})}),d=await r.json();if(d.enabled&&d.audio_base64){const b=Uint8Array.from(atob(d.audio_base64),c=>c.charCodeAt(0));await new Audio(URL.createObjectURL(new Blob([b],{type:'audio/mpeg'}))).play();return}}}catch(e){}if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='hi-IN';u.rate=.95;speechSynthesis.speak(u)}}async function send(text){if(!text)return;add('user',text);history.push({role:'user',content:text});try{if(!API_BASE){add('assistant',flirt.checked?'Aww, tumhari baat mein charm hai. Thoda aur batao?':'Main sun rahi hoon. Aaj tumhare mind mein kya chal raha hai?');return}const r=await fetch(API_BASE+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history:history.slice(-18),settings:{mood:mood.value,flirtMode:flirt.checked,matureMode:false,age18Plus:age.checked}})}),d=await r.json();if(!r.ok)throw Error(d.detail||'Reply nahi aa paaya');add('assistant',d.reply);history.push({role:'assistant',content:d.reply})}catch(e){add('assistant',e.message)}}form.onsubmit=e=>{e.preventDefault();const t=input.value.trim();input.value='';send(t)};document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>send(c.dataset.text));document.querySelector('.bubble .speak').onclick=()=>speak('Heyy, main Lucy hoon. Aaj tumhara mood kaisa hai?');
</script></body></html>
